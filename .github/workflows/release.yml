name: Release Build

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.0'

jobs:

  # ── macOS ──────────────────────────────────────────────────────────────────
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build macOS release
        run: |
          BUILD_DATE="$(date -u '+%Y-%m-%d %H:%M UTC')"
          flutter build macos --release \
            --dart-define=BUILD_VERSION="${{ github.ref_name }}" \
            --dart-define="BUILD_DATE=${BUILD_DATE}"

      - name: Package as DMG
        run: |
          VERSION="${{ github.ref_name }}"
          DMG_NAME="3by5-${VERSION}-macos.dmg"
          mkdir -p /tmp/dmg_staging
          cp -R "build/macos/Build/Products/Release/3by5.app" /tmp/dmg_staging/
          hdiutil create \
            -volname "3by5" \
            -srcfolder /tmp/dmg_staging \
            -ov -format UDZO \
            "${DMG_NAME}"
          echo "DMG_NAME=${DMG_NAME}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: ${{ env.DMG_NAME }}
          retention-days: 1

  # ── Windows ────────────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Scaffold Windows platform support
        run: flutter create --platforms=windows .

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        shell: pwsh
        run: |
          $VERSION = "${{ github.ref_name }}"
          $BUILD_DATE = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd HH:mm UTC")
          flutter build windows --release `
            "--dart-define=BUILD_VERSION=$VERSION" `
            "--dart-define=BUILD_DATE=$BUILD_DATE"

      - name: Package as ZIP
        shell: pwsh
        run: |
          $VERSION = "${{ github.ref_name }}"
          $ZIP_NAME = "3by5-${VERSION}-windows.zip"
          Compress-Archive `
            -Path "build\windows\x64\runner\Release\*" `
            -DestinationPath $ZIP_NAME
          "ZIP_NAME=$ZIP_NAME" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: ${{ env.ZIP_NAME }}
          retention-days: 1

  # ── Linux ──────────────────────────────────────────────────────────────────
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Scaffold Linux platform support
        run: flutter create --platforms=linux .

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux release
        run: |
          BUILD_DATE="$(date -u '+%Y-%m-%d %H:%M UTC')"
          flutter build linux --release \
            --dart-define=BUILD_VERSION="${{ github.ref_name }}" \
            --dart-define="BUILD_DATE=${BUILD_DATE}"

      - name: Package as tar.gz
        run: |
          VERSION="${{ github.ref_name }}"
          TAR_NAME="3by5-${VERSION}-linux.tar.gz"
          tar -czf "${TAR_NAME}" -C "build/linux/x64/release/bundle" .
          echo "TAR_NAME=${TAR_NAME}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-tar
          path: ${{ env.TAR_NAME }}
          retention-days: 1

  # ── GitHub Release ─────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Set release metadata
        id: meta
        run: |
          BUILD_DATE="$(date -u '+%Y-%m-%d %H:%M UTC')"
          TAG="${{ github.ref_name }}"
          IS_PRERELEASE=false
          if [[ "$TAG" == *alpha* || "$TAG" == *beta* ]]; then
            IS_PRERELEASE=true
          fi
          echo "build_date=${BUILD_DATE}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "3by5 ${{ github.ref_name }}"
          prerelease: ${{ steps.meta.outputs.is_prerelease }}
          files: |
            *.dmg
            *.zip
            *.tar.gz
          body: |
            ## 3by5 ${{ github.ref_name }}

            **Build date:** ${{ steps.meta.outputs.build_date }}

            > ⚠️ **Alpha release — work in progress. Back up your data before updating.**

            ---

            ## Downloads

            | Platform | File |
            |----------|------|
            | macOS (10.15+) | `3by5-${{ github.ref_name }}-macos.dmg` |
            | Windows (10+) | `3by5-${{ github.ref_name }}-windows.zip` |
            | Linux (x64) | `3by5-${{ github.ref_name }}-linux.tar.gz` |

            ---

            ## Installation

            ### macOS
            1. Download the `.dmg` and double-click to mount it
            2. Drag **3by5.app** to your Applications folder
            3. **First launch — unsigned build warning:** macOS will block the app.
               Right-click (or Control-click) the app icon → **Open** → click **Open** in the dialog.
               You only need to do this once per version.

            ### Windows
            1. Download and extract the `.zip` file
            2. Run `three_by_five.exe` inside the extracted folder
            3. Windows SmartScreen may warn about an unknown publisher —
               click **More info** → **Run anyway**

            ### Linux
            1. Extract: `tar -xzf 3by5-${{ github.ref_name }}-linux.tar.gz`
            2. Run: `./three_by_five`
               (if needed: `chmod +x three_by_five` first)
